# Sistema de encomendas: MySQL + API Laravel + site React.
# Subir tudo:  docker compose up -d --build
# Abrir:       http://localhost:8080
#
# Configuração opcional: copie .env.docker.example para .env (nesta pasta) e ajuste.

name: recebeaqui

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-encomendas}
      MYSQL_USER: ${DB_USERNAME:-encomendas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-encomendas_senha}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_senha_troque}
    volumes:
      - db-data:/var/lib/mysql
    # Sem porta publicada: o banco só é acessível pelos outros containers
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_senha_troque}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend-laravel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-RecebeAqui}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: pt_BR
      APP_LOCAL_TIMEZONE: ${APP_LOCAL_TIMEZONE:-America/Sao_Paulo}
      FRONTEND_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-encomendas}
      DB_USERNAME: ${DB_USERNAME:-encomendas}
      DB_PASSWORD: ${DB_PASSWORD:-encomendas_senha}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      SEED_DEMO: ${SEED_DEMO:-true}
      # Email
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-avisos@example.com}
      MAIL_FROM_NAME: ${APP_NAME:-RecebeAqui}
      # WhatsApp: none (gratuito, botão "Avisar pelo meu WhatsApp") | log | zapi | ultramsg | twilio
      WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-none}
      ZAPI_INSTANCE: ${ZAPI_INSTANCE:-}
      ZAPI_TOKEN: ${ZAPI_TOKEN:-}
      ZAPI_CLIENT_TOKEN: ${ZAPI_CLIENT_TOKEN:-}
      ULTRAMSG_INSTANCE: ${ULTRAMSG_INSTANCE:-}
      ULTRAMSG_TOKEN: ${ULTRAMSG_TOKEN:-}
      TWILIO_SID: ${TWILIO_SID:-}
      TWILIO_TOKEN: ${TWILIO_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
    volumes:
      - backend-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

  # ---------- Colocar na internet de graça (Cloudflare Tunnel) ----------
  # Opcional. Não abre porta no roteador e já entrega HTTPS.
  #
  # Teste rápido, sem conta (o endereço muda a cada vez que sobe):
  #   docker compose --profile tunel-teste up -d
  #   docker compose logs tunnel-teste    -> procure "https://....trycloudflare.com"
  tunnel-teste:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunel-teste"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

  # Endereço fixo (conta gratuita na Cloudflare + domínio apontado para ela):
  #   1. Crie o túnel em one.dash.cloudflare.com > Networks > Tunnels e copie o token
  #   2. Em "Public hostname", aponte o domínio para o serviço http://frontend:80
  #   3. Coloque CLOUDFLARE_TUNNEL_TOKEN=... no .env e rode:
  #      docker compose --profile tunel up -d
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  db-data:
  backend-storage:
